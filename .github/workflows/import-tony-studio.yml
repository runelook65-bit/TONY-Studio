name: Import TONY Studio source
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download uploaded project archive
        env:
          ARCHIVE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3IO52oTqehHsCJkJKh7WhcgdlFE/f0edcc9f-066a-4e08-b734-e0840dd59b22.zip
        run: |
          curl --fail --location --show-error --silent --retry 3 "$ARCHIVE_URL" -o /tmp/tony-studio.zip
          unzip -l /tmp/tony-studio.zip
          unzip -o -j /tmp/tony-studio.zip index.html vercel.json -d .
          test -s index.html
          test -s vercel.json
          python3 -m json.tool vercel.json > /dev/null
      - name: Commit imported site and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vercel.json
          git rm .github/workflows/import-tony-studio.yml
          git commit -m "Import TONY Studio from uploaded Vercel archive"
          git push origin HEAD:main
