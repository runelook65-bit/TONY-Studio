name: TONY Studio checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  newsroom-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify backend and browser script syntax
        run: |
          node --check api/article.js
          node --check assets/newsroom.js
      - name: Run newsroom tests
        run: node --test tests/article.test.js
